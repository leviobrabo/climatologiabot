name: Weather alerts CI
on:
  push:
    branches: [main, feat/weather-alerts-i18n-13]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: JavaScript syntax
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Translation and integration tests (no external services)
        run: node --test tests/*.test.js
